
<template>
    <lightning-card title="Recent Accounts">

        <template for:each={accounts} for:item="account">
            <div key={account.Id} class="slds-m-around_small">

                {account.Name}

                <lightning-button
                    label="Delete"
                    variant="destructive"
                    data-id={account.Id}
                    onclick={deleteAccount}>
                </lightning-button>

            </div>
        </template>

        <template if:true={noAccounts}>
            <p class="slds-m-around_small">
                No accounts found.
            </p>
        </template>

    </lightning-card>
</template>
