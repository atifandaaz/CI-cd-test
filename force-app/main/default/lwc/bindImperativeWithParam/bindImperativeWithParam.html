<template>
    <lightning-card title="Bind Imperative with param.">

        <lightning-input label="Search Account" value={searchKey} onchange={handleChange}>
        </lightning-input>
        
        <div class="slds-m-around_small">
            <lightning-button label="Search" onclick={handleSearch}>
            </lightning-button>
        </div>

        <template if:true={accounts}>
            <template for:each={accounts} for:item="account">
                <div key={account.Id} class="slds-m-around_small">
                    {account.Name}
                </div>
            </template>
        </template>
        
    </lightning-card>
</template>
